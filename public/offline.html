<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline — SkyDeck</title>
    <style>
      :root { color-scheme: dark light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #0f161d; color: #e6edf2; font-family: system-ui, sans-serif; text-align: center; }
      @media (prefers-color-scheme: light) { body { background: #f4f7f9; color: #17212b; } }
      main { max-width: 28rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { line-height: 1.5; margin: 0.5rem 0; opacity: 0.85; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; font: inherit; border-radius: 6px; border: 0;
        background: #f5b83d; color: #1a1305; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>SkyDeck shows live aircraft, so it needs an internet connection. Nothing is saved from the last time you looked.</p>
      <p>Your settings, watchlist and collection are still in this browser.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
