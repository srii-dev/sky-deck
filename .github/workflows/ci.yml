name: CI

# Runs the same checks as the half-phase test gate on every pull request and on pushes to dev.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit hash (the tag is in the comment). Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # bun.lock is the source of truth: fail if package.json and the lockfile disagree.
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun x tsc --noEmit
      - run: bun run lint
      - run: bun run build
      # Known vulnerabilities of high or critical severity fail the run. Lower ones (today one moderate
      # advisory in a development tool) are listed in the report below but do not.
      - name: Dependency audit (high and critical block)
        run: bun audit --audit-level=high
      - name: Dependency audit (full report, informational)
        continue-on-error: true
        run: bun audit

  # End-to-end smoke tests in a real browser (Phase 16f). A separate job, so a browser problem
  # is visible on its own and does not hide the result of the checks above.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium-headless-shell
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
